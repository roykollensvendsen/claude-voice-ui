name: measures

# The bridge publishes the measures it sends to the code-health page in
# docs/event-api/measures.json on its main branch. This checks the page has words
# for each one. It runs on every pull request and push to main, and once a day,
# because the bridge can add a measure without anything changing here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"     # daily, before the working day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measures:
    runs-on: ubuntu-latest
    timeout-minutes: 5         # one download and a file read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.12"
      - name: Every measure the bridge publishes has words on the page
        run: uv run --no-project python scripts/measures.py
