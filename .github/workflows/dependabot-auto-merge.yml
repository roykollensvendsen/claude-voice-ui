name: dependabot auto-merge

# Dependabot's small updates, fixes and minor versions, merge themselves once every
# required check is green. A major version can change behaviour the checks do not
# see, so it waits for a person. A grouped pull request counts as its largest update,
# so a group holding one major waits too.
on:
  pull_request:

permissions:
  contents: write          # the merge itself
  pull-requests: write     # turning auto-merge on

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once the checks pass, unless it is a major version
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --rebase "$PR_URL"
