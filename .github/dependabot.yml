# Actions are pinned to a commit so they cannot change under us; this is what
# moves the pins deliberately, as GitHub's hardening guide asks.
# Kept quiet on purpose: once a month, one grouped pull request per ecosystem,
# and never more than two open at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci        # the commit convention this repository enforces
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
