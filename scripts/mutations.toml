# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/claude_voice_ui/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a session with a question waits for an answer"
file = "src/states.ts"
find = 'if \(s\.question\) return "answer";'
replace = 'if (false) return "answer";'

[[rule]]
name = "sessions keep the order of their numbers, whatever their state"
file = "src/states.ts"
find = '\(a\.number \?\? Number\.POSITIVE_INFINITY\) - \(b\.number'
replace = '      0 || a.name.localeCompare(b.name),'

[[rule]]
name = "a focus event matches a session by id as well as by name"
file = "src/view/dom.ts"
find = 'return key != null && \(key === s\.id \|\| key === name\);'
replace = 'return key != null && key === name;'

[[rule]]
name = "the sessions are fetched again every minute"
file = "src/app.ts"
find = '^const POLL_MS = 60_000;'
replace = 'const POLL_MS = 120_000;'

[[rule]]
name = "after two quiet minutes the speech bubble goes away"
file = "src/app/stream.ts"
find = '^export const FOCUS_MS = 2 \* 60_000;'
replace = 'export const FOCUS_MS = 20 * 60_000;'

[[rule]]
name = "being signed out while watching returns to the sign-in page"
file = "src/app.ts"
find = 'if \(error instanceof SignedOut\) showSignIn\(\);'
replace = 'if (false) showSignIn();'

[[rule]]
name = "a missing required thing shows a red banner"
file = "src/view/top.ts"
find = 'const severity = failing\.some\(\(c\) => c\.required\) \? "required" : "optional";'
replace = 'const severity = "optional";'

[[rule]]
name = "the check is asked again every five minutes, not on every refresh"
file = "src/app.ts"
find = '^const DOCTOR_MS = 5 \* 60_000;'
replace = 'const DOCTOR_MS = 60_000;'

[[rule]]
name = "the state the bridge reports wins over the app's own reading"
file = "src/states.ts"
find = 'if \(s\.state && Object\.hasOwn\(LOOK, s\.state\)\) return s\.state as CardState;'
replace = 'if (false) return s.state as CardState;'

[[rule]]
name = "being behind is marked as behind even when also ahead"
file = "src/git.ts"
find = 'return \[\{ text: `\$\{arrows\} \$\{name\}`, kind: d\.behind \? "behind" : "ahead" \}\];'
replace = 'return [{ text: `${arrows} ${name}`, kind: d.ahead ? "ahead" : "behind" }];'

[[rule]]
name = "a reached limit says so"
file = "src/usage.ts"
find = 'if \(w\.status === "rejected"\) return \{ text: t\("usage\.reached"\), severity: "stop" \};'
replace = '  if (false) return { text: "", severity: "stop" };'

[[rule]]
name = "usage is asked again every minute"
file = "src/app.ts"
find = '^const USAGE_MS = 60_000;'
replace = 'const USAGE_MS = 120_000;'

[[rule]]
name = "the update starts only after the owner confirms"
file = "src/app/updating.ts"
find = 'home\.update = \{ \.\.\.IDLE, phase: "confirm" \};'
replace = 'void updating.confirm();'

[[rule]]
name = "an approval it waits on is shown, to be answered by voice or at the screen"
file = "src/view/detail.ts"
find = 'if \(p\.approvals\.length\) parts\.push\(el\("p", "muted", t\("pending\.answerElsewhere"\)\)\);'
replace = 'if (false) parts.push(el("p", "muted", ""));'

[[rule]]
name = "a new turn announced on the stream is fetched after the last one shown"
file = "src/app/page.ts"
find = '\(\) => deps\.bridge\.output\(id, home\.open\?\.lastIndex\),'
replace = '() => deps.bridge.output(id, undefined),'

[[rule]]
name = "a hidden session comes back when it starts waiting"
file = "src/app.ts"
find = 'if \(at !== undefined && WAITS\.has\(cardState\(s\)\) && at !== moment\(s\)\) \{'
replace = '      if (false) {'

[[rule]]
name = "the view chosen is remembered"
file = "src/app/home.ts"
find = 'view: recall<View>\(keep, VIEW, "grid"\) === "cards" \? "cards" : "grid",'
replace = '    view: "grid" as View,'

[[rule]]
name = "every kind of waiting is amber, as in the design draft"
file = "src/states.ts"
find = 'const WAITING_TONE = "amber";'
replace = 'const WAITING_TONE = "gold";'

[[rule]]
name = "a long press opens the session's page without choosing it"
file = "src/view/sessions.ts"
find = '^    if \(held\) \{$'
replace = '    if (false) {'

[[rule]]
name = "the order holds still while a finger is on the screen"
file = "src/app.ts"
find = '^    if \(pressing \|\| typing\(\)\) \{$'
replace = '    if (typing()) {'

[[rule]]
name = "a tap just after the sessions moved chooses nothing"
file = "src/app.ts"
find = 'return began === id && pressedAt - movedAt >= SETTLE_MS;'
replace = '    return began === id;'

[[rule]]
name = "the percentage turns from grey to yellow to red near the limit"
file = "src/usage.ts"
find = 'if \(warning === "allowed_warning" \|\| percent >= 70\) return "warn";'
replace = '  if (false) return "warn";'

[[rule]]
name = "a new version is loaded only when the notice is tapped"
file = "src/app.ts"
find = 'if \(latestBuild !== deps\.version\.built\) \{'
replace = '      if (latestBuild !== deps.version.built) { (deps.reload ?? (() => {}))();'

[[rule]]
name = "the theme chosen is remembered"
file = "src/app/home.ts"
find = 'theme: \(\["light", "dark"\] as const\)\.find\(\(t\) => t === recall<string>\(keep, THEME, "system"\)\) \?\? "system",'
replace = '    theme: "system" as Theme,'

[[rule]]
name = "the language chosen is remembered"
file = "src/app/home.ts"
find = 'language: recalledLanguage\(keep\),'
replace = '    language: "system" as Language | "system",'

[[rule]]
name = "a name the voice used matches the session on this computer, not one of that name on another machine"
file = "src/states.ts"
find = 's\.machine \? label\(s\) : s\.name;'
replace = 's.name;'

[[rule]]
name = "a machine's folded group stays folded when the page opens again"
file = "src/app/home.ts"
find = 'folded: new Set\(recall<string\[\]>\(keep, FOLDED, \[\]\)\),'
replace = 'folded: new Set<string>(),'

[[rule]]
name = "a terminal is offered only on this computer, and only for a session that runs on it"
file = "src/view/terminal.ts"
find = 'if \(!home.here \|\| !s \|\| s.machine\) return \[\];'
replace = 'if (!s) return [];'

[[rule]]
name = "an exempt measure shows its reason and is never marked green"
file = "src/view/health.ts"
find = 'return m\.status === "exempt" \? \[el\("span", "reason", m\.text\)\] : \[\];'
replace = 'return [];'

[[rule]]
name = "a section folded by hand stays folded until something new waits in it"
file = "src/app/sections.ts"
find = 'if \(alarms.some\(\(id\) => !was.alarms.includes\(id\)\)\) was.open = true;'
replace = '    if (alarms.length) was.open = true;'

[[rule]]
name = "a switch groups the sessions by machine instead, and the phone remembers it"
file = "src/app/preferences.ts"
find = 'return recall<string>\(keep, GROUP_BY, "programme"\) === "machine" \? "machine" : "programme";'
replace = '  return "programme";'

[[rule]]
name = "each role shows its purpose, who fills it, its limits and routing, and an unfilled one is marked"
file = "src/view/org.ts"
find = 'const unfilled = org.unfilled.includes\(r.id\) \|\| !r.sessions.length;'
replace = '  const unfilled = false;'

[[rule]]
name = "the code-health page looks again only while it is open and the bridge is measuring"
file = "src/app/actions.ts"
find = 'if \(home\.health === next\) void readHealth\(\);'
replace = '          void readHealth();'

[[rule]]
name = "every component in a programme keeps its name, however few sessions it has"
file = "src/view/programmes.ts"
find = 'return part\(home, act, members\[0\]\?\.component\?\.name \?\? id, members\);'
replace = '    return sessionList(home, act, members, null);'

[[rule]]
name = "two sessions with the same name each say what tells them apart"
file = "src/view/dom.ts"
find = 'if \(!home\.sessions\.some\(\(o\) => o\.id !== s\.id && o\.name === s\.name\)\) return \[\];'
replace = '  return [];'
